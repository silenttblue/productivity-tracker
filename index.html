<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo App</title>
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Todo List</h1>
        <button id="darkModeBtn">🌙 Dark</button>
        
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <input type="date" id="dueDateInput">
           
            <button id="addTaskBtn">Add Task</button>
        </div>
       
<div class="search-section">
    <input type="text" id="searchInput" placeholder="Search tasks...">
</div>
<div class="filter-bar">
    <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="high">🔴 High</button>
        <button class="filter-btn" data-filter="medium">🟡 Medium</button>
        <button class="filter-btn" data-filter="low">🟢 Low</button>
        <button class="filter-btn" data-filter="completed">✅ Done</button>
    </div>
    <select id="sortSelect">
        <option value="default">Sort: Default</option>
        <option value="priority">Sort: Priority</option>
        <option value="dueDate">Sort: Due Date</option>
    </select>
</div>
       
        <ul id="taskList"></ul>
        <p id="message"></p>
    </div>
    <div id="undoPopup">completed  <button id="undoBtn">Undo</button> </div>
    <div id="appreciationPopup" style="display: none;">🏁 List cleared. Not everyone does that.</div>
    <script src="script.js"></script>
</body>
</html>
